<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Web</title>
  <style>
    /* Minimal layout only — full UI/UX styling deferred */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    #app { max-width: 420px; margin: 0 auto; }
    #display { background: #f5f5f5; padding: .75rem 1rem; border-radius: 8px; margin-bottom: .5rem; min-height: 4rem; text-align: right; }
    [data-theme=dark] #display { background: #222; color: #fff; }
    #display-expr   { font-size: 1.1rem; word-break: break-all; min-height: 1.4em; }
    #display-result { font-size: 1.5rem; font-weight: bold; min-height: 1.8em; }
    #buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; margin-bottom: .75rem; }
    button { padding: .9rem .5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px;
             background: #fff; cursor: pointer; min-height: 44px; min-width: 44px; }
    button:hover { background: #e8e8e8; }
    [data-theme=dark] button { background: #333; color: #fff; border-color: #555; }
    [data-theme=dark] button:hover { background: #444; }
    button[data-action=equals]    { background: #007bff; color: #fff; grid-column: span 2; }
    button[data-action=clear]     { background: #dc3545; color: #fff; }
    button[data-action=backspace] { background: #fd7e14; color: #fff; }
    #theme-row { display: flex; justify-content: flex-end; margin-bottom: .75rem; }
    #history-section h2 { font-size: .9rem; margin-bottom: .4rem; }
    #history-list { list-style: none; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; }
    #history-list li { padding: .5rem .75rem; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; gap: .5rem; }
    #history-list li:last-child { border-bottom: none; }
    #history-list li:hover { background: #f0f4ff; }
    [data-theme=dark] #history-list { border-color: #444; }
    [data-theme=dark] #history-list li { border-color: #333; color: #eee; }
    [data-theme=dark] #history-list li:hover { background: #2a2a3a; }
    .hist-expr   { color: #555; font-size: .85rem; word-break: break-all; }
    .hist-result { font-weight: bold; white-space: nowrap; }
    [data-theme=dark] .hist-expr { color: #aaa; }
    #btn-clear-history { margin-top: .4rem; font-size: .8rem; padding: .3rem .7rem; }
  </style>
</head>
<body>
<div id="app" role="main">

  <!-- Theme toggle -->
  <div id="theme-row">
    <button id="btn-theme" aria-label="Ganti tema">🌙</button>
  </div>

  <!-- Display -->
  <section id="display" aria-label="Layar kalkulator">
    <div id="display-expr"  aria-label="Ekspresi" aria-live="off">0</div>
    <div id="display-result" aria-label="Hasil"   aria-live="polite"></div>
  </section>

  <!-- Button grid -->
  <div id="buttons" role="group" aria-label="Tombol kalkulator">
    <!-- Row 1 -->
    <button data-action="clear"     aria-label="Hapus semua">C</button>
    <button data-action="backspace" aria-label="Hapus satu karakter">⌫</button>
    <button data-action="paren"  data-value="(" aria-label="Kurung buka">(</button>
    <button data-action="paren"  data-value=")" aria-label="Kurung tutup">)</button>

    <!-- Row 2 -->
    <button data-action="op"    data-value="√" aria-label="Akar kuadrat">√</button>
    <button data-action="op"    data-value="^" aria-label="Pangkat">x^y</button>
    <button data-action="op"    data-value="÷" aria-label="Bagi">÷</button>
    <button data-action="op"    data-value="×" aria-label="Kali">×</button>

    <!-- Row 3 -->
    <button data-action="digit" data-value="7" aria-label="7">7</button>
    <button data-action="digit" data-value="8" aria-label="8">8</button>
    <button data-action="digit" data-value="9" aria-label="9">9</button>
    <button data-action="op"    data-value="-" aria-label="Kurang">−</button>

    <!-- Row 4 -->
    <button data-action="digit" data-value="4" aria-label="4">4</button>
    <button data-action="digit" data-value="5" aria-label="5">5</button>
    <button data-action="digit" data-value="6" aria-label="6">6</button>
    <button data-action="op"    data-value="+" aria-label="Tambah">+</button>

    <!-- Row 5 -->
    <button data-action="digit" data-value="1" aria-label="1">1</button>
    <button data-action="digit" data-value="2" aria-label="2">2</button>
    <button data-action="digit" data-value="3" aria-label="3">3</button>

    <!-- Equals spans 2 rows on the right -->
    <button data-action="equals" aria-label="Sama dengan" style="grid-row: span 2">=</button>

    <!-- Row 6 -->
    <button data-action="digit" data-value="0" aria-label="0" style="grid-column: span 2">0</button>
    <button data-action="dot"   data-value="." aria-label="Titik desimal">.</button>
  </div>

  <!-- History -->
  <section id="history-section" aria-label="Riwayat perhitungan">
    <h2>Riwayat</h2>
    <ul id="history-list" aria-label="Daftar riwayat perhitungan"></ul>
    <button id="btn-clear-history" aria-label="Hapus semua riwayat">Hapus riwayat</button>
  </section>

</div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
